name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pixy_test
          MYSQL_USER: pixy
          MYSQL_PASSWORD: pixy_test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://pixy:pixy_test_password@127.0.0.1:3306/pixy_test
      TEST_DATABASE_URL: mysql://pixy:pixy_test_password@127.0.0.1:3306/pixy_test
      PIXY_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: npm ci
      - name: Generate Prisma client
        shell: pwsh
        run: npm run prisma:generate
      - name: Validate Prisma schema
        shell: pwsh
        run: npx prisma validate
      - name: Run tests
        shell: pwsh
        run: npm test
