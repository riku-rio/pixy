name: Refresh package lock

on:
  push:
    branches:
      - fix/production-readiness-mysql-safety
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh mysql package lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-mysql-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package.json
      - name: Generate lockfile
        shell: pwsh
        run: |
          Remove-Item package-lock.json -Force -ErrorAction SilentlyContinue
          npm install --package-lock-only --ignore-scripts
          Remove-Item .github/workflows/refresh-lockfile.yml -Force
      - name: Commit generated lockfile
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/refresh-lockfile.yml
          git commit -m 'chore: refresh mysql package lock'
          git push
